# FEXCore for visionOS on its own, so that the Apple port of the translator can be worked on
# without building everything else. Its log goes to the ci-logs branch (fexcore.txt).
name: visionos-fexcore
on:
  push:
    paths:
      - visionos/patches/fex-*.patch
      - visionos/scripts/build-fexcore.sh
      - .github/workflows/visionos-fexcore.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visionos-fexcore
  cancel-in-progress: true
jobs:
  fexcore:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Tools
        run: brew install ccache ninja || true
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-fexcore-${{ github.sha }}
          restore-keys: ccache-fexcore-
      - name: Build FEXCore for visionOS
        run: |
          set -o pipefail
          bash visionos/scripts/build-fexcore.sh 2>&1 | tee fexcore.log
      - name: Publish the log
        if: always()
        run: bash visionos/scripts/ci-publish-log.sh fexcore fexcore.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fexcore-visionos
          path: build/visionos/fexcore/**/*.a
          retention-days: 7
