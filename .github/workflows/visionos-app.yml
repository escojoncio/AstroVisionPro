# The Apple Vision Pro app: FEXCore, MoltenVK, FFmpeg and the emulator for visionOS, then the app
# around them (unsigned: it is signed when installed). Its logs go to the ci-logs branch
# (visionos-app.txt), the app to the release "visionos-latest" (AstroQuest.ipa).
#
# macOS runners cost ten times their minutes on a private repository, so this only runs when
# asked for: by hand (Actions > visionos-app > Run workflow), or for a push whose commit message
# has [build] in it. The emulator itself (libastroquest_core.a) is kept between runs and only
# rebuilt when its sources, the submodules it is built from or its build scripts change: a change
# to the app alone builds just the app.
name: visionos-app
on:
  push:
    branches: [main]
    paths:
      - visionos/**
      - shadps4-arm64-main/**
      - .github/workflows/visionos-app.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  app:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    # On the job, not the workflow: a push without [build] (its job skipped) does not cancel a
    # build that is running.
    concurrency:
      group: visionos-app
      cancel-in-progress: true
    runs-on: macos-26
    # The first run on a new repository builds the emulator too (no cache yet).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # What the emulator is built from: its sources, the submodule commits, the patches and
      # the build scripts. The same as last time: the emulator built then is used again.
      - name: What the emulator is built from
        run: |
          git ls-tree -r HEAD shadps4-arm64-main/externals | awk '$2 == "commit"' > core-inputs.txt
          echo "FEX $(cat shadps4-arm64-main/runtime/locks/components.lock.json | shasum)" >> core-inputs.txt
      - uses: actions/cache@v4
        id: core
        with:
          path: visionos/build/core
          key: visionos-core-${{ hashFiles('core-inputs.txt', 'shadps4-arm64-main/src/**', 'shadps4-arm64-main/CMakeLists.txt', 'shadps4-arm64-main/externals/CMakeLists.txt', 'shadps4-arm64-main/cmake/**', 'visionos/patches/**', 'visionos/scripts/build-*.sh', '!visionos/patches/kosmickrisp-*', '!visionos/scripts/build-kosmickrisp.sh') }}

      - name: Submodules the visionOS build uses
        if: steps.core.outputs.cache-hit != 'true'
        run: |
          SKIP="mesa-kosmickrisp vulkan-loader libadrenotools bachata-xserver discord-rpc hwinfo ext-wepoll libdeflate"
          PATHS=()
          while read -r P; do
            NAME=$(basename "$P")
            [[ " $SKIP " == *" $NAME "* ]] && continue
            PATHS+=("$P")
          done < <(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}')
          for ATTEMPT in 1 2 3; do
            git submodule update --init --recursive --depth 1 --jobs 8 -- "${PATHS[@]}" && break
            sleep 10
          done
          # A pinned commit that is not a branch tip cannot always be fetched shallowly.
          git submodule update --init --recursive --jobs 8 -- "${PATHS[@]}"

      - name: Tools
        run: |
          brew install xcodegen || true
          if [[ "${{ steps.core.outputs.cache-hit }}" != "true" ]]; then brew install ccache ninja || true; fi

      - uses: actions/cache@v4
        if: steps.core.outputs.cache-hit != 'true'
        with:
          path: ~/Library/Caches/ccache
          key: ccache-visionos-app-${{ github.sha }}
          restore-keys: ccache-visionos-app-
      - uses: actions/cache@v4
        if: steps.core.outputs.cache-hit != 'true'
        with:
          path: build/visionos/moltenvk
          key: moltenvk-visionos-v1.4.2
      - uses: actions/cache@v4
        if: steps.core.outputs.cache-hit != 'true'
        with:
          path: build/visionos/ffmpeg
          key: ffmpeg-visionos-n7.1.1-${{ hashFiles('visionos/scripts/build-ffmpeg.sh') }}

      - name: The emulator for visionOS (FEXCore, MoltenVK, FFmpeg, shadPS4)
        if: steps.core.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash visionos/scripts/build-fexcore.sh 2>&1 | tee fexcore.log
          bash visionos/scripts/build-moltenvk.sh 2>&1 | tee moltenvk.log
          bash visionos/scripts/build-ffmpeg.sh 2>&1 | tee ffmpeg.log
          bash visionos/scripts/build-core.sh 2>&1 | tee core.log

      # KosmicKrisp, the Vulkan driver with geometry shaders (visionos/scripts/build-kosmickrisp.sh):
      # built when the Mesa commit, the patch or the script change, kept otherwise. Should it
      # fail, the app is still built and draws with MoltenVK.
      - uses: actions/cache@v4
        id: kosmickrisp
        with:
          path: build/visionos/kosmickrisp
          key: kosmickrisp-visionos-${{ hashFiles('visionos/patches/kosmickrisp-visionos.patch', 'visionos/scripts/build-kosmickrisp.sh') }}
      - name: KosmicKrisp for visionOS
        if: steps.kosmickrisp.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          brew install meson pkg-config llvm spirv-tools spirv-llvm-translator libclc || true
          pip3 install --break-system-packages mako packaging pyyaml
          bash visionos/scripts/build-kosmickrisp.sh 2>&1 | tee kosmickrisp.log

      - name: The app
        run: |
          set -o pipefail
          cd visionos
          ls -la build/core
          xcodegen generate
          xcodebuild -project AstroQuest.xcodeproj -scheme AstroQuest \
            -sdk xros -configuration Release -destination 'generic/platform=visionOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../app.log
          APP=$(find build/dd/Build/Products -name 'AstroQuest.app' -maxdepth 3 | head -n 1)
          mkdir -p build/ipa/Payload
          echo "Symbols the app exports (should be just the Mach-O header):"
          nm -gU "$APP/AstroQuest" | tee -a ../app.log | head -5
          cp -R "$APP" build/ipa/Payload/
          KK=../build/visionos/kosmickrisp/KosmicKrisp.framework
          if [[ -f "$KK/KosmicKrisp" ]]; then
            mkdir -p build/ipa/Payload/AstroQuest.app/Frameworks
            cp -R "$KK" build/ipa/Payload/AstroQuest.app/Frameworks/
            echo "KosmicKrisp.framework is in the app" | tee -a ../app.log
          else
            echo "No KosmicKrisp.framework: the app draws with MoltenVK" | tee -a ../app.log
          fi
          (cd build/ipa && zip -qry ../AstroQuest.ipa Payload)
          ls -la build/AstroQuest.ipa

      - name: Publish the logs
        if: always()
        run: bash visionos/scripts/ci-publish-log.sh visionos-app fexcore.log moltenvk.log ffmpeg.log core.log kosmickrisp.log app.log

      # A fixed download link: the Releases page, release "visionos-latest", always the newest app.
      - name: Publish the app as a release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete visionos-latest --yes --cleanup-tag || true
          # Drafts left by an earlier run have no tag: deleted by id.
          gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft and .tag_name == "visionos-latest") | .id' |
            xargs -r -I{} gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/{}" || true
          gh release create visionos-latest visionos/build/AstroQuest.ipa \
            --target "$GITHUB_SHA" --prerelease \
            --title "AstroQuest para Apple Vision Pro (última compilación)" \
            --notes "App sin firmar, compilada de ${GITHUB_SHA::7}. Fírmala con tu cuenta de desarrollador e instálala; los pasos están en README-VISIONOS.md."
          # gh can leave the release a draft (no public link) when the old tag is still being
          # removed: published by hand, then the link checked.
          for i in 1 2 3 4 5; do
            gh release edit visionos-latest --draft=false --prerelease && break
            sleep 10
          done
          for i in $(seq 1 12); do
            code=$(curl -sSIL -o /dev/null -w '%{http_code}' "https://github.com/${GITHUB_REPOSITORY}/releases/download/visionos-latest/AstroQuest.ipa")
            [ "$code" = 200 ] && echo "Download link OK" && exit 0
            sleep 10
          done
          echo "The download link does not answer"; exit 1
