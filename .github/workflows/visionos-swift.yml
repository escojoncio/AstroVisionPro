# A quick check of the app's Swift and Metal code against the visionOS SDK, without building
# the emulator (minutes instead of the full build). Its log: ci-logs branch, visionos-swift.txt.
name: visionos-swift
on:
  push:
    branches: [main]
    paths:
      - visionos/App/**
      - shadps4-arm64-main/src/platform/visionos/astro_core.h
      - .github/workflows/visionos-swift.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visionos-swift
  cancel-in-progress: true
jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Type-check the Swift code and compile the shaders
        run: |
          set -o pipefail
          cd visionos
          {
            xcrun --sdk xros swiftc -typecheck \
              -target arm64-apple-xros26.0 \
              -swift-version 5 \
              -import-objc-header App/Bridge/AstroQuest-Bridging-Header.h \
              -I ../shadps4-arm64-main/src/platform/visionos -I App/Render \
              $(find App -name '*.swift')
            xcrun --sdk xros metal -c App/Render/Shaders.metal -I App/Render -o /tmp/Shaders.air
            echo "Swift and Metal: OK"
          } 2>&1 | tee ../swift.log
      - name: SDK declarations (for reference)
        if: always()
        run: |
          SDK=$(xcrun --sdk xros --show-sdk-path)
          {
            echo "## Accessory tracking and PlayStation VR2 Sense in $SDK"
            for F in $(find "$SDK" -name '*.swiftinterface' -path '*arm64-apple-xros*' \( -path '*ARKit*' -o -path '*GameController*' -o -path '*RealityKit*' \) ); do
              grep -n -E "Accessory|Sense|spatialAccessory|productCategory|GCProductCategory|handedness|Chirality|SpatialTracking" "$F" | sed "s|^|$(basename "$F"): |" | head -120
            done
            echo "## Objective-C headers"
            grep -rn -E "DualSenseVR|Sense|ProductCategory|GCDeviceAccessory|GCControllerProductCategory" "$SDK/System/Library/Frameworks/GameController.framework/Headers" | head -80
            grep -rln -E "AccessoryAnchor|ar_accessory" "$SDK/System/Library/Frameworks/ARKit.framework/Headers" | head
            grep -rn -E "ar_accessory[a-z_]*\(" "$SDK/System/Library/Frameworks/ARKit.framework/Headers" | head -60
          } >> swift.log 2>&1 || true
      - name: Publish the log
        if: always()
        run: bash visionos/scripts/ci-publish-log.sh visionos-swift swift.log
