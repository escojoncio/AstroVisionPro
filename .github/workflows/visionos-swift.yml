# A quick check of the app's Swift and Metal code against the visionOS SDK, without building
# the emulator (minutes instead of the full build). Its log: ci-logs branch, visionos-swift.txt.
name: visionos-swift
on:
  push:
    branches: [main]
    paths:
      - visionos/App/**
      - shadps4-arm64-main/src/platform/visionos/astro_core.h
      - .github/workflows/visionos-swift.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visionos-swift
  cancel-in-progress: true
jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Type-check the Swift code and compile the shaders
        run: |
          set -o pipefail
          cd visionos
          {
            xcrun --sdk xros swiftc -typecheck \
              -target arm64-apple-xros26.0 \
              -swift-version 5 \
              -import-objc-header App/Bridge/AstroQuest-Bridging-Header.h \
              -I ../shadps4-arm64-main/src/platform/visionos -I App/Render \
              $(find App -name '*.swift')
            xcrun --sdk xros metal -c App/Render/Shaders.metal -I App/Render -o /tmp/Shaders.air
            echo "Swift and Metal: OK"
          } 2>&1 | tee ../swift.log
      - name: SDK declarations (for reference)
        if: always()
        run: |
          SDK=$(xcrun --sdk xros --show-sdk-path)
          {
            echo "## ARKit authorization"
            grep -n -i -E "authorization_type_|accessory|UsageDescription" "$SDK/System/Library/Frameworks/ARKit.framework/Headers/authorization.h" | head -40
            grep -n -B3 -A12 "required_authorization" "$SDK/System/Library/Frameworks/ARKit.framework/Headers/accessory_tracking.h" | head -60
            echo "## Info.plist keys mentioned in the SDK headers"
            grep -rhoE "NS[A-Za-z]*UsageDescription|GC[A-Za-z]*(Supported|Supports)[A-Za-z]*|SpatialGamepad|ExtendedGamepad" "$SDK/System/Library/Frameworks/ARKit.framework/Headers" "$SDK/System/Library/Frameworks/GameController.framework/Headers" | sort | uniq -c | head -40
          } >> swift.log 2>&1 || true
      - name: Publish the log
        if: always()
        run: bash visionos/scripts/ci-publish-log.sh visionos-swift swift.log
