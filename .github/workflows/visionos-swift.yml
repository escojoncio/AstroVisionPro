# A quick check of the app's Swift and Metal code against the visionOS SDK, without building
# the emulator (minutes instead of the full build). Its log: ci-logs branch, visionos-swift.txt.
name: visionos-swift
on:
  push:
    branches: [main]
    paths:
      - visionos/App/**
      - shadps4-arm64-main/src/platform/visionos/astro_core.h
      - .github/workflows/visionos-swift.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visionos-swift
  cancel-in-progress: true
jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Type-check the Swift code and compile the shaders
        run: |
          set -o pipefail
          cd visionos
          {
            xcrun --sdk xros swiftc -typecheck \
              -target arm64-apple-xros26.0 \
              -swift-version 5 \
              -import-objc-header App/Bridge/AstroQuest-Bridging-Header.h \
              -I ../shadps4-arm64-main/src/platform/visionos -I App/Render \
              $(find App -name '*.swift')
            xcrun --sdk xros metal -c App/Render/Shaders.metal -I App/Render -o /tmp/Shaders.air
            echo "Swift and Metal: OK"
          } 2>&1 | tee ../swift.log
      - name: SDK declarations (for reference)
        if: always()
        run: |
          SDK=$(xcrun --sdk xros --show-sdk-path)
          {
            echo "## Swift interfaces"
            find "$SDK/System/Library/Frameworks/ARKit.framework" "$SDK/System/Library/Frameworks/GameController.framework" -name '*.swiftinterface' | head
            find "$SDK" -name '*.swiftinterface' 2>/dev/null | grep -i -E "arkit|realitykit" | head
            F=$(grep -rl "AccessoryTrackingProvider" $(find "$SDK" -name '*.swiftinterface' 2>/dev/null) 2>/dev/null | head -n 1)
            echo "## ARKit accessory declarations ($F)"
            grep -n -E "Accessory|Chirality|isHeld|heldChirality" "$F" | head -150
            echo "## GameController spatial controller"
            sed -n 20,35p "$SDK/System/Library/Frameworks/GameController.framework/Headers/GCProductCategories.h"
            grep -rn -E "SpatialController|GCDevice\b|@protocol GCDevice" "$SDK/System/Library/Frameworks/GameController.framework/Headers" | head -20
          } >> swift.log 2>&1 || true
      - name: Publish the log
        if: always()
        run: bash visionos/scripts/ci-publish-log.sh visionos-swift swift.log
